<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo preenche todo o canvas (sem cantos arredondados) para que o SO -->
  <!-- recorte a máscara (círculo, squircle etc.) sem sobrar transparência. -->
  <rect width="512" height="512" fill="#3866d6" />
  <!-- Conteúdo dentro da "safe zone" de 80% recomendada para ícones maskable. -->
  <text
    x="256"
    y="306"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="200"
    font-weight="700"
    fill="#ffffff"
  >M</text>
</svg>
