<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo preenche todo o canvas (sem cantos arredondados) para que o SO -->
  <!-- recorte a máscara (círculo, squircle etc.) sem sobrar transparência. -->
  <rect width="512" height="512" fill="#8C2F35" />
  <!-- Conteúdo dentro da "safe zone" de 80% recomendada para ícones maskable. -->
  <text
    x="256"
    y="300"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="180"
    font-weight="600"
    fill="#FAF6EF"
  >Md</text>
</svg>
